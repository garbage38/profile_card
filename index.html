<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card | Nirmal</title>

    <link rel="shortcut icon" href="./asset/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="circle1"></div>
    <div class="circle2"></div>

    <div class="wrapper">
      <div class="card-wrapper">
        <div>
          <img src="./asset/dp.jpeg" alt="user" />
        </div>

        <div class="user-name">
          <h2>Nirmal Mandal</h2>
        </div>
        <div class="designation">
          <h3>M.Tech • System on Chip Design • IIT Palakkad</h3>
          <h3>B.Tech • Computer Science & Engg • RKMGEC</h3>
        </div>

        <div class="bottom-group">
          <button onclick="openModal()" class="btn-share btn-card">
            <i class="fa-solid fa-share"></i>
            <span>My Social Profile</span>
          </button>

          <a
            href="https://www.linkedin.com/in/nirmal-m-26749a231/"
            target="_blank"
          >
            <button class="btn-follow btn-card">Follow My LinkedIn</button>
          </a>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal">
      <div class="modal-header">
        <h1>My Social Profile</h1>

        <i onclick="closeModal()" class="fa-solid fa-xmark close"></i>
      </div>

      <h3>Connect with me via</h3>

      <div class="icon-container">
        <a
          href="https://www.facebook.com/profile.php?id=61564964406092"
          class="icon"
          id="facebook"
          target="_blank"
        >
          <i class="fab fa-facebook-f"></i>
        </a>

        <a
          href="https://twitter.com/NirmalM28139081"
          class="icon"
          id="twitter"
          target="_blank"
        >
          <i class="fab fa-x-twitter"></i>
        </a>

        <a
          href="https://www.instagram.com/soulofnirmal_/"
          class="icon"
          id="instagram"
          target="_blank"
        >
          <i class="fab fa-instagram"></i>
        </a>

        <a
          href="https://wa.me/919832240288"
          class="icon"
          id="whatsapp"
          target="_blank"
        >
          <i class="fab fa-whatsapp"></i>
        </a>

        <a
          href="https://t.me/imposter108"
          class="icon"
          id="telegram"
          target="_blank"
        >
          <i class="fab fa-telegram"></i>
        </a>

        <a
          href="https://github.com/garbage38"
          class="icon"
          id="github"
          target="_blank"
        >
          <i class="fab fa-github"></i>
        </a>

        <!-- <a href="https://www.linkedin.com/in/nirmal-mandal-26749a231/"
                class="icon"
                id="linkedin"
                target="_blank">
                <i class="fab fa-linkedin-in"></i>
            </a> -->
      </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" onclick="closeModal()"></div>

    <script src="./script.js"></script>
  </body>
</html>
